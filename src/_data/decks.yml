# -----------------------------------------------------------------------------
# Slide decks rendered by the {% slides %} shortcode.
#
# The slides are PNGs committed under src/assets/slides/<name>/, exported from
# Google Slides. Keeping them local is the whole point of the component: the
# viewer is ours, so it carries the site's own chrome and needs no third-party
# player.
#
# To refresh a deck after editing it, run: npm run slides
#
# name    the folder under src/assets/slides/
# title   shown in the viewer's header bar
# count   how many slides; files are 01.png .. NN.png
# ratio   the deck's shape: 1-by-1 (default), 16-by-9 or 4-by-3
# ext     image extension, png by default
# live    OPTIONAL. An embed URL. Set it and the deck shows the provider's
#         real slides in a frame instead of local images.
#
#         The trade: a cross-origin frame cannot be driven from this side.
#         There is no scripting it, no postMessage API, a hash-only change
#         to src is ignored, and reassigning src does not re-navigate. So a
#         live deck keeps the provider's own control bar, and our bar drops
#         to the title and the link out. You get the real slides and our
#         frame, but not our arrows.
#
#         Example:
#           live: "https://docs.google.com/presentation/d/<id>/embed?start=false&loop=false"
# source  the deck itself, for the "open in Slides" action
# -----------------------------------------------------------------------------
- name: quirky
  title: Quirky
  count: 7
  ratio: 1-by-1
  source: "https://docs.google.com/presentation/d/1NFNH_vbr-MS6cg8wZWJGmKkhWvmX85Vx92bIDAT5nLs/edit"

