# -----------------------------------------------------------------------------
# The career band at the top of /cv/.
#
# One entry per role, oldest first. src/_data/career.js turns these into the
# positioned blocks the timeline draws; the prose on the page is written by
# hand in src/cv.md, so if you change a date here change it there too.
#
# start / end  "YYYY-MM". Use `end: present` for the job you are in now - the
#              timeline runs it to the current month and relabels it. Leave
#              `end` empty for a role whose end date is not settled: it runs
#              up to the next role's start and is marked as unconfirmed rather
#              than given an invented month.
# id           the heading it scrolls to when clicked, without the #
# -----------------------------------------------------------------------------
