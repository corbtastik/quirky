# -----------------------------------------------------------------------------
# Serves the built site. Replaces the default.conf in the nginx image.
# -----------------------------------------------------------------------------
server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Eleventy writes /about/index.html, so $uri/ resolves a directory URL on
    # its own. No rewrite rules and no SPA fallback: every page is a real file,
    # and a URL that is not one should 404 rather than silently serve the home
    # page and look like a working link.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Filenames are not fingerprinted, so HTML must never be held: a cached
    # index.html would keep serving yesterday's stream after a deploy.
    location ~* \.(?:html|xml|json)$ {
        add_header Cache-Control "no-cache";
    }

    # Assets change with the content that references them and are cheap to
    # re-fetch, so a week is a reasonable compromise.
    # One header, not two: `expires` emits its own Cache-Control, so pairing
    # it with add_header sends the directive twice.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    gzip              on;
    gzip_types        text/css application/javascript application/json
                      image/svg+xml application/atom+xml;
    gzip_min_length   1024;
}
